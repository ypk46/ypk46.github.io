name: Sync Medium posts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Writing section
        run: python3 scripts/medium.py yuyik46
      - name: Commit if changed
        run: |
          git add data/posts.json index.html writing/index.html
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Medium posts"
          git push
